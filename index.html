<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📅 Routine Reminder</title>
    <style>
        :root {
            --bg-body: #f8fafc; --bg-card: #ffffff; --border: #e2e8f0;
            --text-main: #2d3748; --text-muted: #a0aec0; --primary: #1a202c;
        }
        body.dark-mode {
            --bg-body: #1a202c; --bg-card: #2d3748; --border: #4a5568;
            --text-main: #f8fafc; --text-muted: #718096; --primary: #ffffff;
        }
        body { font-family: 'Malgun Gothic', sans-serif; background-color: var(--bg-body); margin: 0; padding: 20px; color: var(--text-main); transition: 0.2s; }
        .container { max-width: 600px; margin: 40px auto; background: var(--bg-card); padding: 30px; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04); position: relative; }
        .header-area { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 25px; }
        h1 { color: var(--primary); margin: 5px 0; font-size: 1.8em; font-weight: 800; letter-spacing: -0.5px; }
        h2 { color: var(--text-main); margin: 5px 0; font-size: 1.3em; font-weight: 700; }
        .home-nav-btn { position: absolute; left: 0; background: var(--bg-body); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; color: var(--text-main); cursor: pointer; }
        .dark-toggle-area { position: absolute; right: 0; }
        .menu-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
        .menu-item { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; font-size: 1.1em; font-weight: 700; color: var(--text-main); cursor: pointer; transition: 0.2s; text-align: left; display: flex; align-items: center; justify-content: space-between; }
        .menu-item:hover { border-color: var(--text-muted); transform: translateY(-2px); }
        .date-banner-wrap { text-align: center; margin-bottom: 30px; }
        .date-banner-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 10px 24px; border-radius: 30px; font-weight: bold; color: var(--text-main); cursor: pointer; }
        #calendarInput { display: none; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; }
        label { font-weight: 700; margin-bottom: 8px; font-size: 0.85em; color: var(--text-muted); text-transform: uppercase; }
        input, select { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95em; background-color: var(--bg-card); color: var(--text-main); }
        input:disabled, select:disabled { background-color: var(--bg-body); opacity: 0.6; }
        .time-input-group { display: flex; gap: 10px; align-items: center; }
        .time-input-group select { width: 90px; }
        .time-input-group input { flex: 1; }
        .time-checkbox-label { font-size: 0.85em; display: flex; align-items: center; gap: 4px; margin-top: 6px; cursor: pointer; }
        .btn { background: var(--primary); color: var(--bg-card); border: none; padding: 14px; border-radius: 8px; font-size: 1em; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .routine-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 14px 18px; border-radius: 10px; margin-bottom: 12px; border: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
        .routine-item.completed { opacity: 0.4; background: var(--bg-body); border-color: var(--text-muted); }
        .routine-item.completed .routine-name { text-decoration: line-through; color: var(--text-muted); }
        .routine-info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
        .routine-time { font-size: 0.8em; color: var(--text-muted); font-weight: bold; margin-bottom: 2px; }
        .routine-name { font-weight: 600; font-size: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .inline-delete-btn { background: none; border: none; font-size: 1.1em; cursor: pointer; padding: 8px; opacity: 0.5; transition: 0.2s; }
        .inline-delete-btn:hover { opacity: 1; color: #e53e3e; }
        .no-data { text-align: center; color: var(--text-muted); padding: 30px; }
        .sub-inputs { display: none; margin-top: 5px; background: var(--bg-body); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 12px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; background: var(--bg-card); }
        .manage-actions { display: flex; gap: 6px; }
        .action-btn { background: var(--bg-card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; color: var(--text-main); }
        .app-view { display: none; }
        .app-view.active { display: block; }
        .level-badge-zone { background: var(--bg-body); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); text-align: center; }
        .badge-list { display: flex; justify-content: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .badge-icon { font-size: 1.5em; filter: grayscale(100%); opacity: 0.4; }
        .badge-icon.unlocked { filter: grayscale(0%); opacity: 1; }
        .report-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 15px; }
        .report-day-head { text-align: center; font-size: 0.8em; font-weight: bold; color: var(--text-muted); }
        .report-cell { aspect-ratio: 1; border-radius: 6px; background: var(--bg-body); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 0.75em; font-weight: bold; position: relative; }
        .report-cell.has-data { background: #ebf8ff; color: #2b6cb0; }
        .report-cell.perfect { background: #c6f6d5; color: #22543d; border-color: #38a169; }
        .tpl-card { border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); }
    </style>
</head>
<body>
<div class="container">

    <div id="viewMenu" class="app-view active">
        <div class="header-area">
            <h1>Routine Reminder</h1>
            <div class="dark-toggle-area">
                <button onclick="toggleDarkMode()" style="background:none; border:none; font-size:1.3em; cursor:pointer;">🌓</button>
            </div>
        </div>
        <div class="level-badge-zone">
            <div style="font-weight:800; font-size:1.1em;">✨ MY LEVEL: <span id="txtLevel">1</span> (XP: <span id="txtXp">0</span>)</div>
            <div class="badge-list" id="menuBadgeArea"></div>
        </div>
        <div class="menu-grid">
            <button class="menu-item" onclick="switchView('viewList')"><span>📅 Today's Routine</span><span>➔</span></button>
            <button class="menu-item" onclick="prepareCreateView()"><span>✨ Routine 생성하기</span><span>➔</span></button>
            <button class="menu-item" onclick="switchView('viewAllManage')"><span>🗂️ 모든 Routine</span><span>➔</span></button>
            <button class="menu-item" onclick="switchView('viewReport')"><span>📊 월간 Routine 리포트</span><span>➔</span></button>
            <button class="menu-item" onclick="switchView('viewTemplate')"><span>💡 추천 Routine 보관함</span><span>➔</span></button>
        </div>
    </div>

    <div id="viewList" class="app-view">
        <div class="header-area">
            <button class="home-nav-btn" onclick="switchView('viewMenu')">🏠 홈으로</button>
            <h1>Routine Reminder</h1>
        </div>
        <div class="date-banner-wrap">
            <button class="date-banner-btn" onclick="triggerCalendar()"><span id="dateText">📅 날짜 로딩 중...</span></button>
            <input type="date" id="calendarInput" onchange="changeDisplayDate(this.value)">
        </div>
        <div class="routine-list">
            <h2 id="listTitle" style="margin-bottom:15px;">오늘의 Routine 목록</h2>
            <div id="routineItemsArea"></div>
        </div>
    </div>

    <div id="viewCreate" class="app-view">
        <div class="header-area">
            <button class="home-nav-btn" onclick="switchView('viewMenu')">🏠 홈으로</button>
            <h1 id="createViewTitle">Routine 생성하기</h1>
        </div>
        <div class="form-group"><label>Routine 이름</label><input type="text" id="rName" placeholder="Ex) 영양제 먹기, 헬스장 가기"></div>
        <div class="form-group">
            <label>Routine 시간</label>
            <div class="time-input-group">
                <select id="rAmPm"><option value="오전">오전</option><option value="오후">오후</option></select>
                <input type="text" id="rTextTime" placeholder="Ex) 08:30 또는 9:00">
            </div>
            <label class="time-checkbox-label"><input type="checkbox" id="noTimeCheck" onchange="toggleTimeInput(this.checked)"> 시간 지정 안 함</label>
        </div>
        <div class="form-group"><label>Routine 시작 날짜</label><input type="date" id="rStartDate"></div>
        <div class="form-group">
            <label>반복 주기</label>
            <select id="rType" onchange="toggleSubInputs()">
                <option value="매일">매일</option><option value="격일">격일 (2일마다)</option>
                <option value="1주일">1주일 주기</option><option value="2주일">2주일 주기</option>
                <option value="한 달">한 달 주기</option><option value="요일선택">요일 선택</option>
            </select>
        </div>
        <div id="subInputs" class="sub-inputs">
            <div class="form-group" id="dayCheckboxes">
                <label>원하는 요일 선택</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" value="월"> 월</label><label><input type="checkbox" value="화"> 화</label>
                    <label><input type="checkbox" value="수"> 수</label><label><input type="checkbox" value="목"> 목</label>
                    <label><input type="checkbox" value="금"> 금</label><label><input type="checkbox" value="토"> 토</label>
                    <label><input type="checkbox" value="일"> 일</label>
                </div>
            </div>
        </div>
        <button class="btn" id="submitBtn" onclick="saveRoutineAction()">Routine 등록하기</button>
    </div>

    <div id="viewAllManage" class="app-view">
        <div class="header-area">
            <button class="home-nav-btn" onclick="switchView('viewMenu')">🏠 홈으로</button>
            <h1>모든 Routine</h1>
        </div>
        <div id="allManageItemsArea" style="margin-top:15px;"></div>
    </div>

    <div id="viewReport" class="app-view">
        <div class="header-area">
            <button class="home-nav-btn" onclick="switchView('viewMenu')">🏠 홈으로</button>
            <h1>📊 월간 리포트</h1>
        </div>
        <div style="text-align:center; margin-bottom:15px; font-weight:bold; font-size:1.1em;">
            <span id="reportMonthText">달성 현황</span>
        </div>
        <div class="level-badge-zone" style="text-align:left; font-size:0.9em; line-height:1.6em;">
            👑 <b>이달의 가장 성실한 Routine:</b> <span id="bestRoutineText">없음</span>
        </div>
        <div class="report-grid" id="reportCalendarGrid"></div>
    </div>

    <div id="viewTemplate" class="app-view">
        <div class="header-area">
            <button class="home-nav-btn" onclick="switchView('viewMenu')">🏠 홈으로</button>
            <h1>💡 추천 보관함</h1>
        </div>
        <div id="templateArea" style="margin-top:15px;"></div>
    </div>

</div>

<script>
    let routines = JSON.parse(localStorage.getItem('routines')) || [];
    let completedDates = JSON.parse(localStorage.getItem('completedDates')) || {}; 
    let currentDisplayDate = new Date().toISOString().split('T')[0];
    let editingRoutineId = null;

    window.onload = function() {
        initDefaultDates();
        autoDarkTimer();
        updateLevelSystem();
        renderDisplay();
    };

    function initDefaultDates() {
        document.getElementById('calendarInput').value = currentDisplayDate;
        document.getElementById('rStartDate').value = currentDisplayDate;
    }

    function switchView(viewId) {
        document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if(viewId === 'viewMenu') updateLevelSystem();
        if(viewId === 'viewList') renderDisplay();
        if(viewId === 'viewAllManage') renderAllManageView();
        if(viewId === 'viewReport') renderReportView();
        if(viewId === 'viewTemplate') renderTemplateView();
    }

    function prepareCreateView() {
        editingRoutineId = null;
        document.getElementById('createViewTitle').innerText = 'Routine 생성하기';
        document.getElementById('submitBtn').innerText = 'Routine 등록하기';
        document.getElementById('rName').value = '';
        document.getElementById('rTextTime').value = '';
        document.getElementById('noTimeCheck').checked = false;
        toggleTimeInput(false);
        document.getElementById('rType').value = '매일';
        toggleSubInputs();
        initDefaultDates();
        switchView('viewCreate');
    }

    function triggerCalendar() { document.getElementById('calendarInput').showPicker(); }
    function changeDisplayDate(val) { if (!val) return; currentDisplayDate = val; renderDisplay(); }
    
    function toggleSubInputs() {
        const type = document.getElementById('rType').value;
        document.getElementById('subInputs').style.display = (type === '요일선택') ? 'block' : 'none';
    }
    
    function toggleTimeInput(isNoTime) {
        document.getElementById('rAmPm').disabled = isNoTime;
        document.getElementById('rTextTime').disabled = isNoTime;
        if (isNoTime) document.getElementById('rTextTime').value = '';
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }
    
    function autoDarkTimer() {
        const isLocalDark = localStorage.getItem('darkMode') === 'true';
        const currentHour = new Date().getHours();
        if (isLocalDark || currentHour >= 21 || currentHour < 6) {
            document.body.classList.add('dark-mode');
        }
    }

    function updateLevelSystem() {
        let totalCompletedCount = 0;
        Object.keys(completedDates).forEach(date => {
            totalCompletedCount += completedDates[date].length;
        });
        
        let xp = totalCompletedCount * 10;
        let level = Math.floor(xp / 100) + 1;
        
        document.getElementById('txtLevel').innerText = level;
        document.getElementById('txtXp').innerText = xp;

        const badges = [
            { id: 'b1', icon: '🌱', name: '시작이 반', req: 10 },
            { id: 'b2', icon: '🔥', name: '작심삼일 격파', req: 30 },
            { id: 'b3', icon: '👑', name: 'Routine 마스터', req: 100 }
        ];

        const area = document.getElementById('menuBadgeArea');
        area.innerHTML = '';
        badges.forEach(b => {
            const isUnlocked = xp >= b.req;
            area.insertAdjacentHTML('beforeend', `<span class="badge-icon ${isUnlocked ? 'unlocked' : ''}" title="${b.name} (필수 XP:${b.req})">${b.icon}</span>`);
        });
    }

    function saveRoutineAction() {
        const name = document.getElementById('rName').value.trim();
        const isNoTime = document.getElementById('noTimeCheck').checked;
        const ampm = isNoTime ? '' : document.getElementById('rAmPm').value;
        const textTime = isNoTime ? '언제든' : document.getElementById('rTextTime').value.trim();
        const startDate = document.getElementById('rStartDate').value;
        const type = document.getElementById('rType').value;

        if (!name || (!isNoTime && !textTime) || !startDate) return alert('모든 필드를 입력바랍니다.');

        let selectedDays = [];
        if (type === '요일선택') {
            selectedDays = Array.from(document.querySelectorAll('#dayCheckboxes input[type="checkbox"]:checked')).map(cb => cb.value);
            if (selectedDays.length === 0) return alert('요일을 선택해주세요.');
        }

        if (editingRoutineId) {
            const idx = routines.findIndex(r => r.id === editingRoutineId);
            if (idx > -1) {
                routines[idx] = { id: editingRoutineId, name, isNoTime, ampm, time: textTime, startDate, type, days: selectedDays };
            }
        } else {
            routines.push({ id: 'rt_' + Date.now(), name, isNoTime, ampm, time: textTime, startDate, type, days: selectedDays });
        }
        saveData();
        switchView('viewMenu');
    }

    function editRoutine(id) {
        const target = routines.find(r => r.id === id);
        if (!target) return;
        editingRoutineId = id;
        document.getElementById('createViewTitle').innerText = 'Routine 수정하기';
        document.getElementById('submitBtn').innerText = 'Routine 수정 완료';
        document.getElementById('rName').value = target.name;
        document.getElementById('noTimeCheck').checked = target.isNoTime;
        toggleTimeInput(target.isNoTime);
        if (!target.isNoTime) {
            document.getElementById('rAmPm').value = target.ampm;
            document.getElementById('rTextTime').value = target.time;
        }
        document.getElementById('rStartDate').value = target.startDate;
        document.getElementById('rType').value = target.type;
        toggleSubInputs();
        document.querySelectorAll('#dayCheckboxes input[type="checkbox"]').forEach(cb => {
            cb.checked = target.days.includes(cb.value);
        });
        switchView('viewCreate');
    }

    function isRoutineOnDate(routine, targetDateStr) {
        if (!routine.startDate || !targetDateStr) return false;
        
        const start = new Date(routine.startDate + 'T00:00:00');
        const target = new Date(targetDateStr + 'T00:00:00');
        if (target < start) return false;
        
        const diffDays = Math.round((target - start) / (1000 * 60 * 60 * 24));
        
        switch(routine.type) {
            case '매일': return true;
            case '격일': return diffDays % 2 === 0;
            case '1주일': return diffDays % 7 === 0;
            case '2주일': return diffDays % 14 === 0;
            case '한 달': return start.getDate() === target.getDate();
            case '요일선택': return routine.days.includes(['일', '월', '화', '수', '목', '금', '토'][target.getDay()]);
            default: return false;
        }
    }

    function toggleComplete(routineId) {
        if (!completedDates[currentDisplayDate]) completedDates[currentDisplayDate] = [];
        const idx = completedDates[currentDisplayDate].indexOf(routineId);
        if (idx > -1) completedDates[currentDisplayDate].splice(idx, 1);
        else completedDates[currentDisplayDate].push(routineId);
        saveData();
        renderDisplay();
    }

    function deleteRoutine(id) {
        if (!confirm('정말 삭제하시겠습니까?')) return;
        routines = routines.filter(r => r.id !== id);
        
        Object.keys(completedDates).forEach(date => {
            completedDates[date] = completedDates[date].filter(rid => rid !== id);
        });
        
        saveData();
        renderDisplay();
        if (document.getElementById('viewAllManage').classList.contains('active')) {
            renderAllManageView();
        }
    }

    function saveData() {
        localStorage.setItem('routines', JSON.stringify(routines));
        localStorage.setItem('completedDates', JSON.stringify(completedDates));
    }

    function renderDisplay() {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const d = new Date(currentDisplayDate + 'T00:00:00');
        document.getElementById('dateText').innerText = `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
        
        const area = document.getElementById('routineItemsArea');
        area.innerHTML = '';
        const activeRoutines = routines.filter(r => isRoutineOnDate(r, currentDisplayDate));

        if (activeRoutines.length === 0) {
            area.innerHTML = '<div class="no-data">지정된 Routine이 없습니다.</div>';
            return;
        }

        activeRoutines.sort((a,b) => a.isNoTime - b.isNoTime || a.time.localeCompare(b.time));
        const doneList = completedDates[currentDisplayDate] || [];

        activeRoutines.forEach(r => {
            const isCompleted = doneList.includes(r.id);
            area.insertAdjacentHTML('beforeend', `
                <div class="routine-item ${isCompleted ? 'completed' : ''}" onclick="toggleComplete('${r.id}')">
                    <div class="routine-info">
                        <div class="routine-time">${r.isNoTime ? '언제든' : r.ampm + ' ' + r.time}</div>
                        <div class="routine-name">${r.name}</div>
                    </div>
                    <button class="inline-delete-btn" onclick="event.stopPropagation(); deleteRoutine('${r.id}')">🗑️</button>
                </div>
            `);
        });
    }

    function renderAllManageView() {
        const area = document.getElementById('allManageItemsArea');
        area.innerHTML = '';
        if(routines.length === 0) { area.innerHTML = '<div class="no-data">등록된 Routine이 없습니다.</div>'; return; }
        routines.forEach(r => {
            area.insertAdjacentHTML('beforeend', `
                <div class="manage-item">
                    <div class="routine-info">
                        <div class="routine-time">[${r.type}] ${r.isNoTime ? '시간 미지정' : r.ampm + ' ' + r.time}</div>
                        <div class="routine-name">${r.name}</div>
                    </div>
                    <div class="manage-actions">
                        <button class="action-btn edit" onclick="editRoutine('${r.id}')">수정</button>
                        <button class="action-btn delete" onclick="deleteRoutine('${r.id}')">삭제</button>
                    </div>
                </div>
            `);
        });
    }

    function renderReportView() {
        const now = new Date();
        const year = now.getFullYear(), month = now.getMonth();
        document.getElementById('reportMonthText').innerText = `${year}년 ${month + 1}월 달성 현황`;

        const counts = {};
        Object.keys(completedDates).forEach(date => {
            completedDates[date].forEach(rid => { counts[rid] = (counts[rid] || 0) + 1; });
        });
        let bestId = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b, null);
        const bestRt = routines.find(r => r.id === bestId);
        document.getElementById('bestRoutineText').innerText = bestRt ? `${bestRt.name} (총 ${counts[bestId]}회 달성)` : '없음';

        const grid = document.getElementById('reportCalendarGrid');
        grid.innerHTML = '';
        const dayHeads = ['일', '월', '화', '수', '목', '금', '토'];
        dayHeads.forEach(h => grid.insertAdjacentHTML('beforeend', `<div class="report-day-head">${h}</div>`));

        const firstDay = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) grid.insertAdjacentHTML('beforeend', `<div></div>`);

        for (let date = 1; date <= lastDate; date++) {
            const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
            const tRoutines = routines.filter(r => isRoutineOnDate(r, dateStr));
            const cRoutines = completedDates[dateStr] || [];
            
            let statusClass = '';
            if (tRoutines.length > 0) {
                const doneCount = cRoutines.filter(id => tRoutines.some(r => r.id === id)).length;
                if (doneCount > 0) statusClass = (doneCount === tRoutines.length) ? 'perfect' : 'has-data';
            }

            grid.insertAdjacentHTML('beforeend', `<div class="report-cell ${statusClass}">${date}</div>`);
        }
    }

    function renderTemplateView() {
        const templates = [
            { name: '💧 아침 물 한 잔 마시기', type: '매일', ampm: '오전', time: '07:00' },
            { name: '🧘 하루 10분 스트레칭', type: '매일', ampm: '오후', time: '10:00' },
            { name: '📚 독서 30분 하기', type: '매일', ampm: '오후', time: '09:00' }
        ];
        const area = document.getElementById('templateArea');
        area.innerHTML = '';
        templates.forEach((t, idx) => {
            area.insertAdjacentHTML('beforeend', `
                <div class="tpl-card">
                    <div>
                        <div style="font-weight:bold;">${t.name}</div>
                        <div style="font-size:0.8em; color:var(--text-muted);">${t.type} | ${t.ampm} ${t.time}</div>
                    </div>
                    <button class="action-btn edit" onclick="addTemplateByIndex(${idx})">추가</button>
                </div>
            `);
        });
    }

    window.addTemplateByIndex = function(idx) {
        const templates = [
            { name: '💧 아침 물 한 잔 마시기', type: '매일', ampm: '오전', time: '07:00' },
            { name: '🧘 하루 10분 스트레칭', type: '매일', ampm: '오후', time: '10:00' },
            { name: '📚 독서 30분 하기', type: '매일', ampm: '오후', time: '09:00' }
        ];
        const t = templates[idx];
        routines.push({ id: 'rt_' + Date.now(), name: t.name, isNoTime: false, ampm: t.ampm, time: t.time, startDate: new Date().toISOString().split('T')[0], type: t.type, days: [] });
        saveData();
        alert('보관함에서 Routine이 추가되었습니다!');
        switchView('viewMenu');
    };
</script>
